[package]
name = "a11-bot"
version = "0.1.1"
edition = "2021"
rust-version = "1.80"
description = "Личный бот расписания группы А-11 (БТЭУ): память и скорость"

[dependencies]
# HTTP только блокирующий: один поток опроса + один поток таймеров, без async-рантайма
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
