name: deploy

# Прод живёт на Cloudflare Workers и деплоится вручную: npx wrangler deploy
# из workers/. Рестарты fps.ms больше не нужны; этот workflow оставлен как
# метка на каждый пуш, чтобы старый рестарт не вернулся случайно.

on:
  push:
    branches: [main]

jobs:
  note:
    runs-on: ubuntu-latest
    steps:
      - name: Воркер деплоится вручную, fps.ms больше не рестартует
        run: |
          echo "деплой воркера вручную: npx wrangler deploy (из workers/); панель fps.ms не трогается"
