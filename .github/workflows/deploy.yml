name: deploy

on:
  push:
    branches: [main]

jobs:
  restart:
    runs-on: ubuntu-latest
    steps:
      - name: Restart fps.ms server (pull + run latest commit)
        run: |
          curl -sf --max-time 30 -X POST \
            "https://panel.fps.ms/api/client/servers/1438731f/power" \
            -H "Authorization: Bearer ${{ secrets.FPSMS_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"signal": "restart"}' > /dev/null
          echo "restart requested; сервер перезапустится и сам сделает git pull"
