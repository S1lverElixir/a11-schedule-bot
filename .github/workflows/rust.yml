name: rust-build

# Сборка бота на Rust: статический бинарник для хостинга, тесты и замер памяти.
# Рабочий деплой живёт в deploy.yml и здесь не меняется.

on:
  push:
    branches: [main]
    paths: ["rust/**", ".github/workflows/rust.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: инструменты musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: тесты и паритет
        run: cargo test --manifest-path rust/Cargo.toml

      - name: статический бинарник
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: cargo build --release --manifest-path rust/Cargo.toml --target x86_64-unknown-linux-musl

      - name: проверка бинарника и памяти на Linux
        run: |
          BIN=rust/target/x86_64-unknown-linux-musl/release/a11-bot
          file "$BIN"
          ls -l "$BIN"
          "$BIN" --selftest 2

      - uses: actions/upload-artifact@v4
        with:
          name: a11-bot-linux-musl
          path: rust/target/x86_64-unknown-linux-musl/release/a11-bot

      - name: скользящий релиз rust-latest
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rust-latest
          name: rust-latest
          body: "Текущая сборка бота расписания А-11 на Rust"
          files: rust/target/x86_64-unknown-linux-musl/release/a11-bot
          prerelease: true

      # Хостинг забирает бота из репозитория: run.py запускает rust/bin/a11-bot.
      # Свежий бинарник коммитится сюда же, иначе прод останется на старом коде.
      - name: положить бинарник в репозиторий
        id: bin
        run: |
          cp rust/target/x86_64-unknown-linux-musl/release/a11-bot rust/bin/a11-bot
          if git diff --quiet -- rust/bin/a11-bot; then
            echo "changed=0" >> "$GITHUB_OUTPUT"
            echo "бинарник не изменился"
            exit 0
          fi
          echo "changed=1" >> "$GITHUB_OUTPUT"
          git config user.name "a11-bot"
          git config user.email "a11-bot@users.noreply.github.com"
          git add rust/bin/a11-bot
          git commit -m "rust: бинарник пересобран из ${GITHUB_SHA::7}"
          git push

      # Пуш от GITHUB_TOKEN не запускает другие workflow, поэтому перезапуск
      # просим у панели прямо здесь: контейнер подтянет новый бинарник.
      - name: перезапустить сервер с новым бинарником
        if: steps.bin.outputs.changed == '1'
        run: |
          curl -sf --max-time 30 -X POST \
            "https://panel.fps.ms/api/client/servers/1438731f/power" \
            -H "Authorization: Bearer ${{ secrets.FPSMS_API_KEY }}" \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131.0.0.0 Safari/537.36" \
            -H "Content-Type: application/json" \
            -d '{"signal": "restart"}' > /dev/null
          echo "restart requested"
